<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Ace 'Em Revision</title>

  <style>
    :root {
      --navy: #0b2d42;
      --blue: #1769aa;
      --light: #f4f7fa;
      --white: #ffffff;
      --dark: #1f2933;
      --grey: #607080;
      --green: #1b7f3a;
      --red: #b00020;
      --border: #d8e0e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.5;
    }

    header {
      background: var(--navy);
      color: var(--white);
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    main {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    select,
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1rem;
    }

    button {
      background: var(--blue);
      color: var(--white);
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0f4f82;
    }

    button:disabled {
      background: #9aa9b5;
      cursor: not-allowed;
    }

    button.secondary {
      background: #405566;
    }

    button.secondary:hover {
      background: #2f3f4c;
    }

    .quiz-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      color: var(--grey);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      background: #e8f1f8;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
      color: #174b72;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
    }

    .stem {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .option {
      display: block;
      background: #f0f4f7;
      border: 1px solid #d8e0e8;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    .option:hover {
      background: #e7eff5;
    }

    .option input {
      margin-right: 10px;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f6f8fa;
      border-left: 6px solid var(--grey);
    }

    .feedback.correct {
      border-left-color: var(--green);
    }

    .feedback.incorrect {
      border-left-color: var(--red);
    }

    .source {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #334;
      background: #eef3f7;
      padding: 10px;
      border-radius: 8px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .score-box {
      background: #f0f4f7;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .score-box strong {
      display: block;
      font-size: 1.4rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 800px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .score-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Ace 'Em Revision</h1>
  </header>

  <main>
    <section class="panel">
      <h2>Start a revision session</h2>

      <div class="controls">
        <div>
          <label for="bookFilter">Book</label>
          <select id="bookFilter">
            <option value="all">All books</option>
          </select>
        </div>

        <div>
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </div>

        <div>
          <label>&nbsp;</label>
          <button id="startBtn" type="button" disabled>Loading</button>
        </div>
      </div>
    </section>

    <section id="quizPanel" class="panel hidden">
      <div class="quiz-meta">
        <span id="questionCounter"></span>
        <span id="questionDetails"></span>
      </div>

      <div id="questionTags"></div>

      <p id="questionStem" class="stem"></p>

      <div id="answerArea"></div>

      <button id="submitBtn" type="button">Submit answer</button>
      <button id="nextBtn" type="button" class="secondary hidden">Next question</button>

      <div id="feedback" class="feedback hidden"></div>
    </section>

    <section class="panel">
      <h2>Session score</h2>
      <div class="score-grid">
        <div class="score-box">
          <strong id="correctCount">0</strong>
          Correct
        </div>
        <div class="score-box">
          <strong id="incorrectCount">0</strong>
          Incorrect
        </div>
        <div class="score-box">
          <strong id="answeredCount">0</strong>
          Answered
        </div>
        <div class="score-box">
          <strong id="accuracyRate">0%</strong>
          Accuracy
        </div>
      </div>
    </section>
  </main>

  <script src="question-banks.js"></script>
  <script>
    let allQuestions = [];
    let activeQuestions = [];
    let currentIndex = 0;
    let correct = 0;
    let incorrect = 0;
    let answered = 0;

    const bookFilter = document.getElementById("bookFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const startBtn = document.getElementById("startBtn");
    const quizPanel = document.getElementById("quizPanel");
    const questionCounter = document.getElementById("questionCounter");
    const questionDetails = document.getElementById("questionDetails");
    const questionTags = document.getElementById("questionTags");
    const questionStem = document.getElementById("questionStem");
    const answerArea = document.getElementById("answerArea");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const feedback = document.getElementById("feedback");
    const correctCount = document.getElementById("correctCount");
    const incorrectCount = document.getElementById("incorrectCount");
    const answeredCount = document.getElementById("answeredCount");
    const accuracyRate = document.getElementById("accuracyRate");

    function getQuestionTypeLabel(type) {
      if (type === "mcq") {
        return "MCQ";
      }

      if (type === "multi") {
        return "Multiple response";
      }

      return String(type).toUpperCase();
    }

    function getBroadCategory(question) {
      if (question.category) {
        return question.category;
      }

      if (question.broadCategory) {
        return question.broadCategory;
      }

      const text = `${question.chapter || ""} ${question.topic || ""}`.toLowerCase();

      if (text.includes("airway") || text.includes("ventilation") || text.includes("resuscitation") || text.includes("neonatal")) {
        return "Airway and resuscitation";
      }

      if (text.includes("cardiac") || text.includes("cardiovascular") || text.includes("rhythm") || text.includes("coronary") || text.includes("heart") || text.includes("shock") || text.includes("syncope") || text.includes("vascular") || text.includes("aortic")) {
        return "Cardiovascular";
      }

      if (text.includes("respiratory") || text.includes("pulmonary") || text.includes("asthma") || text.includes("copd") || text.includes("pneumonia") || text.includes("pneumothorax") || text.includes("dyspnoea") || text.includes("dyspnea")) {
        return "Respiratory";
      }

      if (text.includes("abdominal") || text.includes("gastro") || text.includes("bowel") || text.includes("pancreatitis") || text.includes("cholecystitis") || text.includes("jaundice") || text.includes("liver")) {
        return "Gastrointestinal";
      }

      if (text.includes("renal") || text.includes("urinary") || text.includes("urolog") || text.includes("genitourinary")) {
        return "Renal and genitourinary";
      }

      if (text.includes("pregnancy") || text.includes("obstetric") || text.includes("gyne") || text.includes("gyna") || text.includes("vaginal") || text.includes("pelvic")) {
        return "Obstetrics and gynaecology";
      }

      if (text.includes("pediatric") || text.includes("paediatric") || text.includes("child") || text.includes("infant") || text.includes("neonate")) {
        return "Paediatrics";
      }

      if (text.includes("toxic") || text.includes("poison") || text.includes("drug") || text.includes("overdose") || text.includes("alcohol") || text.includes("antidote")) {
        return "Toxicology and pharmacology";
      }

      if (text.includes("trauma") || text.includes("injury") || text.includes("fracture") || text.includes("burn") || text.includes("wound") || text.includes("bite") || text.includes("sting") || text.includes("laceration")) {
        return "Trauma and injuries";
      }

      if (text.includes("neuro") || text.includes("stroke") || text.includes("seizure") || text.includes("headache") || text.includes("coma") || text.includes("altered mental status")) {
        return "Neurology";
      }

      if (text.includes("endocrine") || text.includes("diabetes") || text.includes("thyroid") || text.includes("adrenal") || text.includes("ketoacidosis")) {
        return "Endocrine and metabolic";
      }

      if (text.includes("infect") || text.includes("sepsis") || text.includes("fever") || text.includes("hiv") || text.includes("rabies") || text.includes("tetanus")) {
        return "Infectious disease";
      }

      if (text.includes("environment") || text.includes("cold") || text.includes("heat") || text.includes("drowning") || text.includes("altitude") || text.includes("diving") || text.includes("electrical")) {
        return "Environmental emergencies";
      }

      if (text.includes("eye") || text.includes("ear") || text.includes("nose") || text.includes("throat") || text.includes("oral") || text.includes("dental") || text.includes("neck")) {
        return "ENT, eye and oral";
      }

      if (text.includes("skin") || text.includes("dermat")) {
        return "Skin";
      }

      if (text.includes("psych") || text.includes("behaviour") || text.includes("behavior") || text.includes("panic")) {
        return "Behavioural health";
      }

      if (text.includes("palliative")) {
        return "Palliative care";
      }

      return "Other";
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Could not load ${src}`));
        document.head.appendChild(script);
      });
    }

    async function loadQuestionBanks() {
      if (!Array.isArray(window.QUESTION_BANKS)) {
        alert("question-banks.js did not load correctly. Check that it exists in the repository root.");
        return [];
      }

      for (const bank of window.QUESTION_BANKS) {
        await loadScript(bank.src);
      }

      const combinedQuestions = [];

      window.QUESTION_BANKS.forEach(bank => {
        const bankQuestions = window[bank.variable];

        if (!Array.isArray(bankQuestions)) {
          alert(`${bank.src} did not define ${bank.variable} correctly.`);
          return;
        }

        combinedQuestions.push(...bankQuestions);
      });

      return combinedQuestions;
    }

    function initialiseFilters() {
      bookFilter.innerHTML = '<option value="all">All books</option>';
      categoryFilter.innerHTML = '<option value="all">All categories</option>';

      const books = [...new Set(allQuestions.map(question => question.book))].sort();
      const categories = [...new Set(allQuestions.map(question => getBroadCategory(question)))].sort();

      books.forEach(book => {
        const option = document.createElement("option");
        option.value = book;
        option.textContent = book;
        bookFilter.appendChild(option);
      });

      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });
    }

    function startQuiz() {
      const selectedBook = bookFilter.value;
      const selectedCategory = categoryFilter.value;

      activeQuestions = allQuestions.filter(question => {
        const bookMatch = selectedBook === "all" || question.book === selectedBook;
        const categoryMatch = selectedCategory === "all" || getBroadCategory(question) === selectedCategory;
        return bookMatch && categoryMatch;
      });

      activeQuestions = shuffle(activeQuestions);
      currentIndex = 0;
      correct = 0;
      incorrect = 0;
      answered = 0;

      updateScore();

      if (activeQuestions.length === 0) {
        alert("No questions match those filters.");
        return;
      }

      quizPanel.classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      const question = activeQuestions[currentIndex];
      const broadCategory = getBroadCategory(question);

      questionCounter.textContent = `Question ${currentIndex + 1} of ${activeQuestions.length}`;
      questionDetails.textContent = getQuestionTypeLabel(question.type);

      questionTags.innerHTML = `
        <span class="tag">${broadCategory}</span>
        <span class="tag">${question.chapter}</span>
        <span class="tag">${question.book}</span>
      `;

      questionStem.textContent = question.stem;
      answerArea.innerHTML = "";
      feedback.className = "feedback hidden";
      feedback.innerHTML = "";

      submitBtn.classList.remove("hidden");
      nextBtn.classList.add("hidden");

      if (question.type === "mcq") {
        renderSingleBestAnswer(question);
      }

      if (question.type === "multi") {
        renderMultipleResponse(question);
      }
    }

    function renderSingleBestAnswer(question) {
      question.options.forEach((optionText, index) => {
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `
          <input type="radio" name="answer" value="${index}">
          ${optionText}
        `;
        answerArea.appendChild(label);
      });
    }

    function renderMultipleResponse(question) {
      question.options.forEach((optionText, index) => {
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `
          <input type="checkbox" name="answer" value="${index}">
          ${optionText}
        `;
        answerArea.appendChild(label);
      });
    }

    function submitAnswer() {
      const question = activeQuestions[currentIndex];
      let isCorrect = false;

      if (question.type === "mcq") {
        const selected = document.querySelector("input[name='answer']:checked");

        if (!selected) {
          alert("Choose an answer first.");
          return;
        }

        isCorrect = Number(selected.value) === question.correctAnswer;
      }

      if (question.type === "multi") {
        const selectedValues = [...document.querySelectorAll("input[name='answer']:checked")]
          .map(input => Number(input.value))
          .sort((a, b) => a - b);

        if (selectedValues.length === 0) {
          alert("Choose at least one answer first.");
          return;
        }

        const correctValues = [...question.correctAnswers].sort((a, b) => a - b);
        isCorrect = JSON.stringify(selectedValues) === JSON.stringify(correctValues);
      }

      answered += 1;

      if (isCorrect) {
        correct += 1;
        feedback.className = "feedback correct";
        feedback.innerHTML = `
          <strong>Correct.</strong>
          <p>${question.explanation}</p>
          <div class="source"><strong>Source:</strong> ${question.source}</div>
        `;
      } else {
        incorrect += 1;
        feedback.className = "feedback incorrect";
        feedback.innerHTML = `
          <strong>Incorrect.</strong>
          <p>${question.explanation}</p>
          <div class="source"><strong>Source:</strong> ${question.source}</div>
        `;
      }

      updateScore();
      submitBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex += 1;

      if (currentIndex >= activeQuestions.length) {
        quizPanel.classList.add("hidden");
        alert(`Session complete. Correct: ${correct}. Incorrect: ${incorrect}.`);
        return;
      }

      showQuestion();
    }

    function updateScore() {
      correctCount.textContent = correct;
      incorrectCount.textContent = incorrect;
      answeredCount.textContent = answered;

      const accuracy = answered === 0 ? 0 : Math.round((correct / answered) * 100);
      accuracyRate.textContent = `${accuracy}%`;
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    async function initialiseApp() {
      startBtn.textContent = "Loading";
      startBtn.disabled = true;

      try {
        allQuestions = await loadQuestionBanks();
        initialiseFilters();
        startBtn.textContent = "Start";
        startBtn.disabled = false;
      } catch (error) {
        alert(error.message);
        startBtn.textContent = "Load error";
        startBtn.disabled = true;
      }
    }

    startBtn.addEventListener("click", startQuiz);
    submitBtn.addEventListener("click", submitAnswer);
    nextBtn.addEventListener("click", nextQuestion);

    initialiseApp();
  </script>
</body>
</html>
